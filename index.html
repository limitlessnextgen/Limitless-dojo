<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe5d3">
  <meta name="description" content="Limitless martial arts, strength training and community in Tamraght, Morocco.">
  <title>Limitless | Enter the Dojo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#efe5d3;
      --paper-light:#f7f0e4;
      --ink:#090909;
      --gold:#9a671e;
      --red:#8d2f17;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:var(--paper)}
    body{font-family:"Oswald",Arial,sans-serif;color:var(--ink)}
    .landing{
      position:relative;
      min-height:100dvh;
      overflow:hidden;
      display:grid;
      place-items:center;
      padding:max(22px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
      isolation:isolate;
      background:
        radial-gradient(circle at 50% 42%,rgba(255,255,255,.65),transparent 36%),
        radial-gradient(circle at 20% 15%,rgba(141,47,23,.12),transparent 26%),
        linear-gradient(140deg,var(--paper-light),var(--paper) 58%,#ded0b9);
    }
    .landing::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-5;
      opacity:.45;
      background-image:
        repeating-radial-gradient(circle at 15% 20%,rgba(80,60,40,.09) 0 1px,transparent 1px 4px),
        repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 2px,transparent 2px 6px);
      mix-blend-mode:multiply;
    }
    .red-ring{
      position:absolute;
      z-index:-3;
      width:min(62vw,760px);
      aspect-ratio:1;
      left:min(-21vw,-155px);
      top:min(-28vw,-205px);
      border-radius:50%;
      background:
        radial-gradient(circle,transparent 42%,rgba(141,47,23,.95) 43% 53%,transparent 54%),
        conic-gradient(from 10deg,transparent 0 7%,rgba(141,47,23,.78) 8% 18%,transparent 19% 42%,rgba(141,47,23,.55) 43% 52%,transparent 53% 100%);
      transform:rotate(-14deg);
      filter:blur(.4px);
    }
    .ink-left,.ink-right{
      position:absolute;
      z-index:-2;
      pointer-events:none;
      border-radius:50%;
      filter:blur(24px);
    }
    .ink-left{
      width:48vw;height:38vw;min-width:320px;min-height:260px;
      left:-18vw;bottom:-8vw;
      background:radial-gradient(circle at 42% 48%,rgba(8,8,8,.98),rgba(8,8,8,.64) 42%,transparent 71%);
      transform:rotate(-14deg)
    }
    .ink-right{
      width:43vw;height:37vw;min-width:280px;min-height:240px;
      right:-19vw;bottom:-12vw;
      background:radial-gradient(circle at 48% 50%,rgba(8,8,8,.98),rgba(8,8,8,.58) 44%,transparent 72%);
      transform:rotate(18deg)
    }
    .smoke{
      position:absolute;
      z-index:-1;
      right:-9vw;top:9vh;
      width:33vw;height:42vh;min-width:220px;
      border-radius:50%;
      filter:blur(38px);
      opacity:.3;
      background:radial-gradient(circle at 45% 42%,rgba(130,30,24,.85),rgba(130,30,24,.15) 48%,transparent 72%);
    }
    .content{
      width:min(1050px,100%);
      min-height:calc(100dvh - 44px);
      display:grid;
      justify-items:center;
      align-content:center;
      text-align:center;
      gap:clamp(11px,1.45vh,19px);
      position:relative;
    }
    .ghost-emblem{
      position:absolute;
      inset:50% auto auto 50%;
      transform:translate(-50%,-46%);
      width:min(62vw,650px);
      opacity:.07;
      color:var(--gold);
      pointer-events:none;
    }
    h1{
      margin:0;
      font-family:"UnifrakturCook","Old English Text MT",serif;
      font-size:clamp(5.5rem,13vw,11rem);
      line-height:.83;
      font-weight:700;
      letter-spacing:-.025em;
      color:#050505;
      position:relative;
      z-index:1;
    }
    .subhead,.community,.motto,.location{margin:0;text-transform:uppercase;position:relative;z-index:1}
    .subhead{
      display:flex;
      align-items:center;
      gap:16px;
      width:min(860px,94vw);
      font-size:clamp(.9rem,1.65vw,1.32rem);
      font-weight:700;
      letter-spacing:.08em;
      white-space:nowrap;
    }
    .subhead::before,.subhead::after{
      content:"";height:2px;flex:1;
      background:linear-gradient(90deg,transparent,var(--gold));
    }
    .subhead::after{background:linear-gradient(90deg,var(--gold),transparent)}
    .community{
      display:flex;align-items:center;gap:14px;
      width:min(780px,90vw);
      color:var(--gold);
      font-size:clamp(.84rem,1.4vw,1.14rem);
      font-weight:600;
      letter-spacing:.24em;
      white-space:nowrap;
    }
    .community::before,.community::after{content:"";height:2px;flex:1;background:rgba(154,103,30,.72)}
    .community span{width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block}
    .emblem{
      width:clamp(185px,23vw,270px);
      color:var(--gold);
      position:relative;
      z-index:1;
      filter:drop-shadow(0 9px 14px rgba(70,45,10,.12));
    }
    .emblem svg,.ghost-emblem svg{display:block;width:100%;height:auto}
    .motto{
      font-size:clamp(.86rem,1.5vw,1.2rem);
      font-weight:600;
      letter-spacing:.23em;
      white-space:nowrap;
    }
    .ornament{width:min(430px,72vw);height:22px;position:relative;z-index:1}
    .ornament::before,.ornament::after{content:"";position:absolute;top:50%;width:calc(50% - 24px);height:2px;background:rgba(154,103,30,.62)}
    .ornament::before{left:0}.ornament::after{right:0}
    .ornament span,.ornament span::before,.ornament span::after{
      position:absolute;left:50%;top:50%;width:10px;height:10px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg);content:"";
    }
    .ornament span::before{left:-12px;top:5px}.ornament span::after{left:22px;top:5px}
    .enter{
      position:relative;z-index:2;
      min-width:clamp(260px,31vw,420px);
      min-height:60px;
      display:inline-flex;align-items:center;justify-content:center;
      padding:14px 30px;
      border:2px solid #111;
      color:#111;
      background:rgba(247,240,228,.76);
      text-decoration:none;
      text-transform:uppercase;
      font-weight:700;
      letter-spacing:.24em;
      transition:.2s ease;
    }
    .enter:hover,.enter:focus-visible{background:#111;color:var(--paper-light);transform:translateY(-2px);outline:none}
    .location{
      color:var(--gold);
      font-size:clamp(.65rem,.95vw,.82rem);
      font-weight:700;
      letter-spacing:.28em;
    }
    @media(max-width:700px){
      .landing{overflow:auto;padding:14px}
      .content{min-height:calc(100dvh - 28px);gap:clamp(9px,1.1vh,13px)}
      h1{font-size:clamp(4.2rem,21vw,6.2rem)}
      .subhead{gap:8px;font-size:clamp(.65rem,3.05vw,.82rem);white-space:normal;line-height:1.2}
      .subhead::before,.subhead::after{min-width:18px}
      .community{gap:7px;font-size:clamp(.62rem,2.8vw,.76rem);letter-spacing:.15em;white-space:normal}
      .emblem{width:min(45vw,190px)}
      .motto{font-size:clamp(.67rem,3vw,.82rem);letter-spacing:.14em;white-space:normal;line-height:1.35}
      .enter{width:min(86vw,350px);min-width:0;min-height:56px;font-size:.76rem;letter-spacing:.2em}
      .location{font-size:.59rem;letter-spacing:.18em}
      .ghost-emblem{width:92vw}
      .red-ring{width:88vw;left:-40vw;top:-28vw}
      .ink-left{width:70vw;height:58vw;left:-32vw;bottom:-18vw}
      .ink-right{width:68vw;height:58vw;right:-35vw;bottom:-20vw}
    }
  </style>
</head>
<body>
  <main class="landing">

    <div class="ink-left" aria-hidden="true"></div>
    <div class="ink-right" aria-hidden="true"></div>
    <div class="smoke" aria-hidden="true"></div>

    <section class="content" aria-label="Limitless landing page">
      <div class="ghost-emblem" aria-hidden="true">
        <svg viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg" fill="none">
          <circle cx="120" cy="38" r="27" stroke="currentColor" stroke-width="3"/>

      <h1>Limitless</h1>
      <p class="subhead">Martial Arts • Strength Training</p>
      <p class="community"><span></span>Join the Community<span></span></p>

      <div class="emblem" aria-hidden="true">
        <svg viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg" fill="none">
          <circle cx="120" cy="38" r="27" stroke="currentColor" stroke-width="3"/>
          <path d="M120 12c11 0 19 8 19 19s-8 19-19 19c-3 0-5 0-7-1 8-3 12-9 12-18 0-10-5-16-13-19 2 0 5 0 8 0Z" fill="currentColor"/>
          <path d="M92 12V2M148 12V2M75 27l-9-7M165 27l9-7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>

          <circle cx="41" cy="117" r="3" fill="currentColor"/><circle cx="199" cy="117" r="3" fill="currentColor"/>

          <path d="M120 106c10 8 16 16 16 27 0 13-8 24-16 31-8-7-16-18-16-31 0-11 6-19 16-27Z" stroke="currentColor" stroke-width="3"/>

          <path d="M120 200v36M95 232h50M101 232v22M139 232v22" stroke="currentColor" stroke-width="3"/>
          <circle cx="90" cy="249" r="3" fill="currentColor"/><circle cx="150" cy="249" r="3" fill="currentColor"/>
          <path d="M120 238l13 34-13 14-13-14 13-34Z" stroke="currentColor" stroke-width="3"/>
          <circle cx="120" cy="264" r="4" fill="currentColor"/>
        </svg>
      </div>

      <p class="motto">Train • Evolve • Go Limitless</p>
      <div class="ornament" aria-hidden="true"><span></span></div>
      <a class="enter" href="home.html">Enter the Dojo</a>
      <p class="location">Tamraght • Morocco</p>
    </section>
  </main>
</body>
</html>
