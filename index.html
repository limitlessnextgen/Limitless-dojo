<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080b">
  <meta name="description" content="Train. Evolve. Go Limitless. Martial arts, strength and community in Tamraght, Morocco.">
  <title>Limitless | Train. Evolve. Go Limitless.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #08080b;
      --black-soft: #111116;
      --paper: #d9d9dd;
      --paper-dark: #85858c;
      --purple: #6d31ff;
      --purple-light: #a17cff;
      --line: rgba(255,255,255,.13);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--black);
      color: var(--paper);
    }

    body {
      font-family: "Oswald", Arial, sans-serif;
      overflow-x: hidden;
    }

    .landing {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
      padding:
        max(22px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(22px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 76% 28%, rgba(109,49,255,.18), transparent 26%),
        radial-gradient(circle at 16% 80%, rgba(109,49,255,.09), transparent 30%),
        linear-gradient(145deg, #060608 0%, #101015 48%, #070709 100%);
    }

    .landing::before {
      content: "";
      position: absolute;
      inset: -20%;
      z-index: -3;
      opacity: .34;
      background:
        repeating-radial-gradient(
          ellipse at 74% 26%,
          transparent 0 32px,
          rgba(255,255,255,.06) 33px 34px,
          transparent 35px 61px
        );
      transform: rotate(-8deg);
    }

    .landing::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent);
    }

    .frame {
      width: min(1240px, 100%);
      min-height: min(820px, calc(100svh - 48px));
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      border: 1px solid var(--line);
      background: rgba(5,5,8,.58);
      box-shadow: 0 40px 120px rgba(0,0,0,.48);
      backdrop-filter: blur(10px);
    }

    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(38px, 6vw, 88px);
      border-right: 1px solid var(--line);
      overflow: hidden;
    }

    .hero::after {
      content: "LIMITLESS";
      position: absolute;
      left: -12px;
      bottom: -45px;
      font-family: "UnifrakturCook", "Old English Text MT", serif;
      font-size: clamp(7rem, 15vw, 14rem);
      color: rgba(255,255,255,.018);
      white-space: nowrap;
      pointer-events: none;
    }

    .location {
      position: absolute;
      top: 26px;
      left: clamp(38px, 6vw, 88px);
      margin: 0;
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--paper-dark);
    }

    .headline {
      margin: 0;
      font-family: "UnifrakturCook", "Old English Text MT", Georgia, serif;
      font-weight: 700;
      font-size: clamp(5rem, 10vw, 9.2rem);
      line-height: .69;
      letter-spacing: -.035em;
      text-transform: uppercase;
    }

    .headline span {
      display: block;
      background: linear-gradient(180deg, #eeeeef 8%, #b4b4ba 56%, #73737b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.36));
    }

    .headline .go {
      margin-top: .13em;
      background: linear-gradient(180deg, #b195ff 0%, var(--purple) 54%, #32137f 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .headline .limitless {
      margin-top: .08em;
      font-size: .62em;
      letter-spacing: -.02em;
    }

    .journey {
      margin: clamp(26px, 4vh, 48px) 0 0;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: clamp(.72rem, 1vw, .9rem);
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: #aaaab0;
    }

    .journey::before {
      content: "";
      width: clamp(40px, 6vw, 88px);
      height: 2px;
      background: var(--purple);
      box-shadow: 0 0 20px rgba(109,49,255,.8);
    }

    .statement {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(38px, 5vw, 78px);
    }

    .statement-label {
      margin: 0 0 22px;
      font-size: .69rem;
      font-weight: 700;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--purple-light);
    }

    .seal {
      width: clamp(150px, 15vw, 205px);
      aspect-ratio: 1;
      margin: 0 0 clamp(30px, 5vh, 54px);
      display: grid;
      place-items: center;
      position: relative;
      border-radius: 50%;
      border: 1px solid rgba(161,124,255,.45);
      box-shadow:
        0 0 0 14px rgba(109,49,255,.04),
        0 0 75px rgba(109,49,255,.24);
    }

    .seal::before,
    .seal::after {
      content: "";
      position: absolute;
      width: 120%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(161,124,255,.42), transparent);
      transform: rotate(45deg);
    }

    .seal::after { transform: rotate(-45deg); }

    .seal-ring {
      width: 72%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.18);
      background: radial-gradient(circle, rgba(109,49,255,.18), rgba(0,0,0,.08) 64%, transparent 65%);
    }

    .amazigh {
      font-family: Georgia, serif;
      font-size: clamp(4rem, 7vw, 6.5rem);
      line-height: 1;
      color: var(--purple-light);
      text-shadow: 0 0 28px rgba(109,49,255,.54);
      transform: translateY(-3%);
    }

    .values {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--line);
    }

    .values li {
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      min-height: 64px;
      border-bottom: 1px solid var(--line);
      font-family: "UnifrakturCook", "Old English Text MT", serif;
      font-size: clamp(1.35rem, 2.2vw, 2rem);
      letter-spacing: .01em;
      color: #d4d4d7;
    }

    .values li::before {
      content: "•";
      font-family: Arial, sans-serif;
      font-size: 1.2rem;
      color: var(--purple);
    }

    .enter {
      margin-top: clamp(30px, 5vh, 54px);
      min-height: 62px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      padding: 0 24px 0 28px;
      border: 1px solid rgba(161,124,255,.7);
      color: #f2f2f3;
      text-decoration: none;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .25em;
      text-transform: uppercase;
      background: rgba(109,49,255,.08);
      transition: background .2s ease, transform .2s ease, border-color .2s ease;
    }

    .enter span:last-child {
      font-size: 1.4rem;
      color: var(--purple-light);
      letter-spacing: 0;
    }

    .enter:hover,
    .enter:focus-visible {
      background: rgba(109,49,255,.22);
      border-color: var(--purple-light);
      transform: translateY(-2px);
      outline: none;
    }

    @media (max-width: 820px) {
      .landing {
        display: block;
        overflow-y: auto;
        padding: 0;
      }

      .frame {
        width: 100%;
        min-height: 100svh;
        grid-template-columns: 1fr;
        border: 0;
        background: transparent;
        box-shadow: none;
      }

      .hero {
        min-height: 64svh;
        padding: max(74px, env(safe-area-inset-top)) 24px 46px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .location {
        top: max(25px, env(safe-area-inset-top));
        left: 24px;
      }

      .headline {
        font-size: clamp(4.7rem, 24vw, 7rem);
      }

      .headline .limitless { font-size: .56em; }

      .journey {
        margin-top: 30px;
        font-size: .65rem;
        letter-spacing: .18em;
      }

      .statement {
        min-height: 36svh;
        padding: 42px 24px max(42px, env(safe-area-inset-bottom));
      }

      .statement-top {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 24px;
      }

      .seal {
        width: 112px;
        margin: 0;
      }

      .amazigh { font-size: 3.7rem; }

      .values { margin-top: 30px; }
      .values li { min-height: 58px; font-size: 1.55rem; }
      .enter { width: 100%; margin-top: 30px; }
    }

    @media (max-width: 390px) {
      .headline { font-size: 4.25rem; }
      .statement-top { grid-template-columns: 90px 1fr; gap: 18px; }
      .seal { width: 90px; }
      .amazigh { font-size: 3rem; }
      .statement-label { font-size: .6rem; letter-spacing: .24em; }
      .values li { font-size: 1.35rem; }
    }

    @media (max-height: 680px) and (min-width: 821px) {
      .frame { min-height: calc(100svh - 28px); }
      .hero, .statement { padding-top: 30px; padding-bottom: 30px; }
      .headline { font-size: 6.3rem; }
      .seal { width: 132px; margin-bottom: 22px; }
      .values li { min-height: 48px; }
      .enter { min-height: 52px; margin-top: 22px; }
    }
  </style>
</head>
<body>
  <main class="landing">
    <section class="frame" aria-label="Limitless landing page">
      <div class="hero">
        <p class="location">Tamraght · Morocco</p>
        <h1 class="headline">
          <span>Train</span>
          <span>Evolve</span>
          <span class="go">Go</span>
          <span class="limitless">Limitless</span>
        </h1>
        <p class="journey">The journey never stops</p>
      </div>

      <div class="statement">
        <div class="statement-top">
          <div class="seal" aria-hidden="true">
            <div class="seal-ring"><span class="amazigh">ⵣ</span></div>
          </div>
          <div>
            <p class="statement-label">Brand statement</p>
            <p style="margin:0;max-width:420px;font-size:clamp(.94rem,1.35vw,1.12rem);line-height:1.65;color:#a8a8ae;">
              Built for personal evolution, collective strength and growth without limits.
            </p>
          </div>
        </div>

        <ul class="values" aria-label="Limitless brand values">
          <li>Individual Evolution</li>
          <li>Collective Strength</li>
          <li>Infinite Growth</li>
        </ul>

        <a class="enter" href="home.html">
          <span>Enter the Dojo</span>
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
