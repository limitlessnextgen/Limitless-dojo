<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Enter Limitless, the home of martial arts and strength in Tamraght, Morocco.">
  <title>Limitless | Enter the Dojo</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#050505;color:#efe4cf}
    body{font-family:Arial,Helvetica,sans-serif;overflow:hidden}
    .landing{position:relative;min-height:100svh;width:100%;display:grid;place-items:center;overflow:hidden;isolation:isolate;padding:clamp(18px,4vw,48px);background:
      radial-gradient(circle at 7% 20%,rgba(165,20,18,.54),transparent 28%),
      radial-gradient(circle at 95% 62%,rgba(170,20,18,.56),transparent 31%),
      radial-gradient(circle at 20% 90%,rgba(125,15,12,.42),transparent 27%),
      linear-gradient(180deg,#050505 0%,#0a0808 55%,#040404 100%)}
    .landing::before{content:"";position:absolute;inset:-12%;z-index:-2;background:
      conic-gradient(from 220deg at 4% 2%,transparent 0 8%,rgba(160,25,18,.95) 9% 14%,transparent 15% 100%),
      conic-gradient(from 40deg at 98% 98%,transparent 0 9%,rgba(25,20,20,.96) 10% 17%,transparent 18% 100%);filter:blur(1px)}
    .landing::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.7;background:
      radial-gradient(ellipse at 0% 60%,rgba(110,18,15,.5),transparent 20%),
      radial-gradient(ellipse at 100% 42%,rgba(120,18,15,.52),transparent 22%),
      radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.95),transparent 45%)}
    .content{width:min(1180px,96vw);min-height:calc(100svh - clamp(36px,8vw,96px));display:grid;justify-items:center;align-content:center;text-align:center;gap:clamp(10px,1.8vh,22px);padding:clamp(18px,3vw,38px) 0}
    .symbol{width:clamp(150px,18vw,290px);height:auto;display:block;filter:sepia(.45) saturate(.72) brightness(1.28) contrast(.95);object-fit:contain}
    h1{margin:0;font-family:"Old English Text MT","Lucida Blackletter","UnifrakturCook",Georgia,serif;font-size:clamp(4.7rem,11vw,10.5rem);font-weight:700;line-height:.78;letter-spacing:-.045em;color:#eadfca;text-shadow:0 10px 30px rgba(0,0,0,.8)}
    .sub{margin:0;display:flex;align-items:center;gap:18px;font-size:clamp(.78rem,1.35vw,1.08rem);font-weight:800;letter-spacing:.23em;text-transform:uppercase;color:#eadfca}
    .sub::before,.sub::after{content:"";width:clamp(34px,7vw,110px);height:1px;background:#9f1917}
    .motto{margin:0;font-size:clamp(.8rem,1.45vw,1.13rem);font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:#c92822}
    .enter{display:inline-flex;align-items:center;justify-content:center;min-width:clamp(260px,28vw,420px);min-height:clamp(58px,8vh,78px);margin-top:4px;padding:16px 30px;border:2px solid #a41f1c;color:#f1e5cf;text-decoration:none;font-size:clamp(.8rem,1.2vw,1rem);font-weight:900;letter-spacing:.27em;text-transform:uppercase;background:rgba(0,0,0,.28);transition:.2s ease}
    .enter:hover,.enter:focus-visible{background:#9f1d1a;color:#fff;transform:translateY(-2px);outline:none}
    .location{margin:0;font-size:clamp(.68rem,1vw,.86rem);font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:#d8bd8a}
    .temple-left,.gate-right{position:absolute;bottom:-1px;z-index:-1;opacity:.52;filter:brightness(.55) saturate(.9)}
    .temple-left{left:0;width:min(29vw,430px);height:31vh;background:linear-gradient(145deg,transparent 25%,rgba(0,0,0,.95) 26%);clip-path:polygon(0 35%,48% 0,65% 14%,82% 8%,100% 35%,91% 41%,91% 100%,0 100%)}
    .gate-right{right:4vw;width:min(23vw,330px);height:28vh;border-top:18px solid #070707;border-left:18px solid transparent;border-right:18px solid transparent}
    .gate-right::before,.gate-right::after{content:"";position:absolute;top:4px;width:18px;height:100%;background:#070707}.gate-right::before{left:21%}.gate-right::after{right:21%}
    @media(max-width:700px){
      .landing{padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
      .content{min-height:calc(100svh - 36px);gap:clamp(9px,1.35vh,16px)}
      .symbol{width:clamp(125px,38vw,190px)}
      h1{font-size:clamp(4rem,20vw,6.7rem);line-height:.82}
      .sub{max-width:92vw;gap:8px;font-size:clamp(.58rem,2.7vw,.78rem);letter-spacing:.14em;white-space:nowrap}
      .sub::before,.sub::after{width:20px}
      .motto{font-size:clamp(.62rem,3vw,.82rem);letter-spacing:.18em}
      .enter{min-width:min(82vw,340px);min-height:58px;font-size:.76rem;letter-spacing:.2em}
      .location{font-size:.62rem;letter-spacing:.2em}
      .temple-left{width:48vw;height:22vh}.gate-right{width:38vw;height:19vh;right:-3vw;border-top-width:12px}.gate-right::before,.gate-right::after{width:12px}
    }
    @media(max-height:700px) and (min-width:701px){.content{gap:10px}.symbol{width:150px}h1{font-size:6.2rem}.enter{min-height:54px}.temple-left,.gate-right{height:25vh}}
  </style>
</head>
<body>
  <main class="landing">
    <div class="temple-left" aria-hidden="true"></div>
    <div class="gate-right" aria-hidden="true"></div>
    <section class="content" aria-labelledby="landing-title">
      <img class="symbol" src="assets/limitless-talisman.webp" alt="Limitless Amazigh and dragon symbol">
      <h1 id="landing-title">limitless</h1>
      <p class="sub">The home of martial arts and strength</p>
      <p class="motto">Train&nbsp; • &nbsp;Evolve&nbsp; • &nbsp;Go Limitless</p>
      <a class="enter" href="home.html">Enter Dojo</a>
      <p class="location">Tamraght&nbsp; • &nbsp;Morocco</p>
    </section>
  </main>
</body>
</html>
