<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Enter Limitless, the home of martial arts and strength in Tamraght, Morocco.">
  <title>Limitless | Enter the Dojo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#050505;color:#efe4cf}
    body{font-family:"Oswald",Arial,sans-serif;overflow:hidden}
    .landing{position:relative;width:100%;height:100svh;min-height:100vh;display:grid;place-items:center;overflow:hidden;isolation:isolate;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:radial-gradient(circle at 8% 18%,rgba(166,25,19,.55),transparent 29%),radial-gradient(circle at 92% 60%,rgba(166,25,19,.5),transparent 30%),linear-gradient(180deg,#050505 0%,#0a0808 55%,#040404 100%)}
    .landing::before{content:"";position:absolute;inset:-8%;z-index:-2;background:conic-gradient(from 220deg at 3% 4%,transparent 0 8%,rgba(155,24,18,.9) 9% 14%,transparent 15% 100%),conic-gradient(from 35deg at 98% 98%,transparent 0 10%,rgba(18,15,15,.98) 11% 18%,transparent 19% 100%)}
    .landing::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 0% 70%,rgba(105,16,14,.45),transparent 22%),radial-gradient(ellipse at 100% 44%,rgba(118,16,14,.5),transparent 23%),radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.98),transparent 46%)}
    .content{width:min(1180px,96vw);height:100%;max-height:1000px;display:grid;grid-template-rows:auto auto auto auto auto auto;justify-items:center;align-content:center;text-align:center;gap:clamp(8px,1.5vh,18px);padding:clamp(8px,2vh,24px) 0}
    .symbol{display:block;width:clamp(170px,19vw,300px);height:auto;max-height:30vh;object-fit:contain;object-position:center;filter:sepia(.28) saturate(.82) brightness(1.18) contrast(1.04);mix-blend-mode:screen}
    h1{margin:-4px 0 0;font-family:"UnifrakturCook","Old English Text MT","Lucida Blackletter",serif;font-size:clamp(5.2rem,12vw,11rem);font-weight:700;line-height:.78;letter-spacing:-.03em;color:#e8d8bb;text-shadow:0 8px 26px rgba(0,0,0,.9)}
    .sub{margin:4px 0 0;display:flex;align-items:center;justify-content:center;gap:18px;font-size:clamp(.76rem,1.25vw,1.05rem);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#eadfca;white-space:nowrap}
    .sub::before,.sub::after{content:"";width:clamp(34px,7vw,110px);height:2px;background:#9f1917}
    .motto{margin:0;font-size:clamp(.78rem,1.35vw,1.08rem);font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:#d12b24;white-space:nowrap}
    .enter{display:inline-flex;align-items:center;justify-content:center;min-width:clamp(250px,28vw,420px);min-height:clamp(56px,7vh,76px);margin-top:5px;padding:14px 30px;border:2px solid #a41f1c;color:#f1e5cf;text-decoration:none;font-size:clamp(.78rem,1.1vw,.98rem);font-weight:700;letter-spacing:.25em;text-transform:uppercase;background:rgba(0,0,0,.3);transition:.2s ease}
    .enter:hover,.enter:focus-visible{background:#9f1d1a;color:#fff;transform:translateY(-2px);outline:none}
    .location{margin:0;font-size:clamp(.66rem,.95vw,.84rem);font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:#d8bd8a;white-space:nowrap}
    .temple-left,.gate-right{position:absolute;bottom:-1px;z-index:-1;opacity:.5;filter:brightness(.5) saturate(.9)}
    .temple-left{left:0;width:min(29vw,430px);height:31vh;background:linear-gradient(145deg,transparent 25%,rgba(0,0,0,.96) 26%);clip-path:polygon(0 35%,48% 0,65% 14%,82% 8%,100% 35%,91% 41%,91% 100%,0 100%)}
    .gate-right{right:4vw;width:min(23vw,330px);height:28vh;border-top:18px solid #070707;border-left:18px solid transparent;border-right:18px solid transparent}
    .gate-right::before,.gate-right::after{content:"";position:absolute;top:4px;width:18px;height:100%;background:#070707}.gate-right::before{left:21%}.gate-right::after{right:21%}
    @media(max-width:700px){
      .content{width:100%;gap:clamp(7px,1.15vh,12px);padding:4px 0}
      .symbol{width:clamp(145px,42vw,205px);max-height:25vh}
      h1{margin:-2px 0 0;font-size:clamp(4.5rem,21vw,6.9rem);line-height:.8}
      .sub{gap:7px;font-size:clamp(.55rem,2.45vw,.72rem);letter-spacing:.11em}
      .sub::before,.sub::after{width:15px;height:1px}
      .motto{font-size:clamp(.58rem,2.7vw,.77rem);letter-spacing:.15em}
      .enter{min-width:min(84vw,350px);min-height:56px;font-size:.74rem;letter-spacing:.19em}
      .location{font-size:.6rem;letter-spacing:.18em}
      .temple-left{width:48vw;height:21vh}.gate-right{width:38vw;height:18vh;right:-3vw;border-top-width:12px}.gate-right::before,.gate-right::after{width:12px}
    }
    @media(max-height:700px) and (min-width:701px){
      .content{gap:6px}.symbol{width:160px;max-height:22vh}h1{font-size:6.5rem}.enter{min-height:52px}.temple-left,.gate-right{height:24vh}
    }
  </style>
</head>
<body>
  <main class="landing">
    <div class="temple-left" aria-hidden="true"></div>
    <div class="gate-right" aria-hidden="true"></div>
    <section class="content" aria-labelledby="landing-title">
      <img class="symbol" src="assets/entry-limitless.webp" alt="Limitless original emblem">
      <h1 id="landing-title">limitless</h1>
      <p class="sub">The home of martial arts and strength</p>
      <p class="motto">Train&nbsp; • &nbsp;Evolve&nbsp; • &nbsp;Go Limitless</p>
      <a class="enter" href="home.html">Enter Dojo</a>
      <p class="location">Tamraght&nbsp; • &nbsp;Morocco</p>
    </section>
  </main>
</body>
</html>
