  <meta name="theme-color" content="#070707">
  <title>Limitless | Enter the Dojo</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#070707;color:#efe4cf;font-family:Arial,sans-serif}
    body{min-height:100svh;overflow-x:hidden}
    .entry{min-height:100svh;position:relative;display:grid;place-items:center;overflow:hidden;isolation:isolate;padding:28px;background:
      radial-gradient(circle at 12% 20%,rgba(130,22,18,.46),transparent 25%),
      radial-gradient(circle at 88% 58%,rgba(130,22,18,.42),transparent 28%),
      linear-gradient(180deg,#070707 0%,#0a0909 58%,#050505 100%)}
    .entry:before{content:"";position:absolute;inset:0;z-index:-2;background:
      radial-gradient(circle at 7% 48%,rgba(255,255,255,.09),transparent 16%),
      radial-gradient(circle at 96% 18%,rgba(255,255,255,.08),transparent 18%),
      radial-gradient(circle at 79% 86%,rgba(255,255,255,.06),transparent 19%)}
    .entry:after{content:"";position:absolute;inset:-8%;z-index:-1;opacity:.46;background:
      conic-gradient(from 220deg at 5% 0%,transparent 0 12%,#7e1713 13% 18%,transparent 19% 100%),
      conic-gradient(from 40deg at 100% 100%,transparent 0 12%,#181515 13% 20%,transparent 21% 100%);filter:blur(1px)}
    .content{width:min(1060px,94vw);text-align:center;display:grid;justify-items:center;align-content:center;gap:18px;padding:18px 0 36px}
    .symbol{width:min(310px,43vw);filter:sepia(.55) saturate(.7) brightness(1.25) contrast(.95);mix-blend-mode:screen;opacity:.96}
    h1{margin:-8px 0 0;font-family:"Old English Text MT","Lucida Blackletter",Georgia,serif;font-size:clamp(4.8rem,12vw,10rem);font-weight:700;line-height:.78;letter-spacing:-.055em;color:#e9dfcc;text-shadow:0 8px 30px rgba(0,0,0,.7)}
    .sub{margin:6px 0 0;font-size:clamp(.82rem,1.6vw,1.12rem);font-weight:800;letter-spacing:.25em;text-transform:uppercase;color:#d7b16b}
    .motto{margin:12px 0 8px;font-size:clamp(.82rem,1.55vw,1.12rem);font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:#a91f1d}
    .enter{display:inline-flex;align-items:center;justify-content:center;min-width:min(360px,82vw);min-height:70px;padding:18px 30px;border:2px solid #8e1b1b;color:#efe4cf;text-decoration:none;font-weight:800;letter-spacing:.26em;text-transform:uppercase;background:rgba(0,0,0,.25);transition:.2s ease}
    .enter:hover,.enter:focus{background:#8e1b1b;color:white;transform:translateY(-2px)}
    .location{margin:12px 0 0;font-size:.82rem;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:#d7b16b}
    @media(max-width:700px){.entry{padding:18px}.content{gap:14px}.symbol{width:min(250px,64vw)}h1{font-size:clamp(4rem,20vw,6.4rem)}.sub,.motto,.location{letter-spacing:.18em}.enter{min-height:58px}}
  </style>
</head>
