<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Enter Limitless, the home of martial arts and strength in Tamraght, Morocco.">
  <title>Limitless | Enter the Dojo</title>
  <style>
    :root{--cream:#efe1c5;--gold:#d3b37a;--red:#b6241f;--black:#050505}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--black)}
    body{overflow:hidden;color:var(--cream);font-family:"Arial Narrow","Roboto Condensed",Impact,Arial,sans-serif}
    .landing{position:fixed;inset:0;min-height:100dvh;display:grid;place-items:center;overflow:hidden;isolation:isolate;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:radial-gradient(circle at 8% 25%,rgba(150,25,20,.52),transparent 28%),radial-gradient(circle at 94% 62%,rgba(170,27,22,.48),transparent 30%),radial-gradient(circle at 35% 105%,rgba(105,15,13,.42),transparent 28%),linear-gradient(155deg,#020202 0%,#0b0808 48%,#030303 100%)}
    .landing::before{content:"";position:absolute;width:min(54vw,760px);aspect-ratio:1;left:min(-19vw,-130px);top:min(-25vw,-180px);z-index:-3;border-radius:50%;background:radial-gradient(circle,transparent 43%,rgba(156,27,21,.78) 44% 51%,transparent 52%),conic-gradient(from 20deg,transparent 0 8%,rgba(184,35,27,.75) 9% 20%,transparent 21% 43%,rgba(130,20,17,.55) 44% 53%,transparent 54% 100%);filter:blur(2px);transform:rotate(-17deg)}
    .landing::after{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at center,transparent 0 38%,rgba(0,0,0,.15) 62%,rgba(0,0,0,.7) 100%),repeating-radial-gradient(circle at 82% 65%,rgba(199,42,32,.12) 0 2px,transparent 3px 15px);opacity:.92}
    .smoke-left,.smoke-right{position:absolute;z-index:-1;width:42vw;height:76vh;bottom:-18vh;filter:blur(46px);opacity:.34;border-radius:50%}
    .smoke-left{left:-22vw;background:radial-gradient(circle,rgba(178,33,25,.95),transparent 66%)}
    .smoke-right{right:-22vw;background:radial-gradient(circle,rgba(191,33,25,.9),transparent 66%)}
    .temple{position:absolute;left:0;bottom:0;width:min(31vw,450px);height:29vh;z-index:-1;opacity:.72;background:#020202;clip-path:polygon(0 43%,16% 34%,16% 27%,35% 18%,35% 13%,51% 3%,67% 14%,67% 20%,88% 32%,88% 38%,100% 47%,92% 50%,92% 100%,0 100%)}
    .gate{position:absolute;right:4vw;bottom:0;width:min(22vw,320px);height:25vh;z-index:-1;opacity:.68}
    .gate::before{content:"";position:absolute;left:0;right:0;top:4%;height:12%;background:#020202;clip-path:polygon(0 35%,46% 35%,46% 0,54% 0,54% 35%,100% 35%,94% 70%,56% 70%,56% 100%,44% 100%,44% 70%,6% 70%)}
    .gate::after{content:"";position:absolute;left:17%;right:17%;top:15%;bottom:0;border-left:15px solid #020202;border-right:15px solid #020202;border-top:11px solid #020202}
    .content{width:min(1120px,97vw);max-height:calc(100dvh - 28px);display:grid;justify-items:center;align-content:center;text-align:center;gap:clamp(7px,1.15vh,14px)}
    .art-crop{position:relative;overflow:hidden;isolation:isolate;filter:grayscale(1) invert(1) sepia(.72) saturate(.78) brightness(1.35) contrast(1.2);mix-blend-mode:screen;filter:grayscale(1) invert(1) sepia(.72) saturate(.78) brightness(1.35) contrast(1.2) drop-shadow(0 12px 28px rgba(0,0,0,.8))}
    .art-crop img{position:absolute;display:block;height:auto;max-width:none;user-select:none;pointer-events:none}
    .symbol-crop{width:clamp(165px,23vw,300px);aspect-ratio:.88}
    .symbol-crop img{width:250%;left:50%;top:-142%;transform:translateX(-50%)}
    .wordmark-crop{width:min(91vw,980px);aspect-ratio:3.45}
    .wordmark-crop img{width:115%;left:50%;top:-108%;transform:translateX(-50%)}
    .motto{margin:1px 0 3px;color:#d02a24;text-transform:uppercase;font-weight:900;font-size:clamp(.72rem,1.15vw,1rem);letter-spacing:.29em;line-height:1.35;white-space:nowrap}
    .enter{display:inline-flex;align-items:center;justify-content:center;min-width:clamp(270px,30vw,430px);min-height:clamp(56px,7.3vh,74px);padding:13px 28px;border:2px solid var(--red);background:rgba(0,0,0,.34);color:#f4e7cf;text-decoration:none;text-transform:uppercase;font-weight:900;font-size:clamp(.78rem,1.02vw,.96rem);letter-spacing:.27em;transition:background .2s ease,transform .2s ease}
    .enter:hover,.enter:focus-visible{background:var(--red);transform:translateY(-2px);outline:none}
    .location{margin:2px 0 0;color:var(--gold);text-transform:uppercase;font-weight:900;font-size:clamp(.62rem,.9vw,.8rem);letter-spacing:.30em;white-space:nowrap}
    @media(max-width:700px){
      .content{width:100%;max-height:calc(100dvh - 26px);gap:clamp(7px,1vh,11px)}
      .symbol-crop{width:min(44vw,185px)}
      .wordmark-crop{width:98vw;aspect-ratio:3.45}
      .motto{font-size:clamp(.59rem,2.65vw,.75rem);letter-spacing:.16em}
      .enter{min-width:min(86vw,360px);min-height:56px;font-size:.74rem;letter-spacing:.20em}
      .location{font-size:.60rem;letter-spacing:.19em}
      .temple{width:48vw;height:20vh}.gate{width:38vw;height:18vh;right:-2vw}.gate::after{border-left-width:10px;border-right-width:10px;border-top-width:8px}
      .smoke-left,.smoke-right{width:68vw;height:56vh;bottom:-12vh}
    }
    @media(max-height:650px) and (min-width:701px){.content{gap:5px}.symbol-crop{width:155px}.wordmark-crop{width:min(72vw,760px)}.enter{min-height:50px}.motto{font-size:.74rem}}
  </style>
</head>
<body>
  <main class="landing">
    <div class="smoke-left" aria-hidden="true"></div>
    <div class="smoke-right" aria-hidden="true"></div>
    <div class="temple" aria-hidden="true"></div>
    <div class="gate" aria-hidden="true"></div>
    <section class="content" aria-label="Limitless dojo entrance">
      <div class="art-crop symbol-crop" role="img" aria-label="Limitless emblem"><img src="assets/limitless-logo-art.jpeg" alt=""></div>
      <div class="art-crop wordmark-crop" role="img" aria-label="Limitless, the home of martial arts and strength"><img src="assets/limitless-logo-art.jpeg" alt=""></div>
      <p class="motto">Train &nbsp;•&nbsp; Evolve &nbsp;•&nbsp; Go Limitless</p>
      <a class="enter" href="home.html">Enter Dojo</a>
      <p class="location">Tamraght &nbsp;•&nbsp; Morocco</p>
    </section>
  </main>
</body>
</html>
