name: Phase 1 website improvements

# One-time validated website update
on:
  push:
    branches:
      - phase1-staging
    paths:
      - .github/workflows/phase1-website.yml

permissions:
  contents: write

jobs:
  improve-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: phase1-staging
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Phase 1 improvements
        run: python .github/scripts/phase1_update.py

      - name: Validate whitespace and changed files
        run: |
          git diff --check
          git status --short

      - name: Commit validated Phase 1 changes
        run: |
          git config user.name "Go Limitless Website Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Complete Phase 1 mobile and typography improvements"
            git push origin HEAD:phase1-staging
          fi
